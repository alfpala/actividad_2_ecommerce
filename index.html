<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actividad 2: Tienda Online Básica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Mi CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<div class="layout">
  <!-- Menú de navegación -->
  <header class="d-flex justify-content-between align-items-center">
    <h1 class="h4">Mi Tienda Online</h1>
    <nav class="d-none d-md-block">
      <a href="#" class="text-white text-decoration-none me-3">Inicio</a>
      <a href="#" class="text-white text-decoration-none me-3">Tienda</a>
      <a href="#" class="text-white text-decoration-none">Contacto</a>
    </nav>
  </header>

  <!-- Barra lateral -->
  <aside>
    <h5>Categorías</h5>
    <ul class="list-group list-group-numbered">
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Electrónica
            <span class="badge bg-primary rounded-pill">12</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Ropa
            <span class="badge bg-primary rounded-pill">8</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Hogar
            <span class="badge bg-primary rounded-pill">5</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Deportes
            <span class="badge bg-primary rounded-pill">7</span>
          </li>
        </ul>
  </aside>

  <!-- Contenido principal -->
  <main>
    <div class="productos-grid">
      <!-- Producto 1 -->
      <div class="tarjeta-producto">
        <img src="./assets/images/foto_1.jpg" alt="Producto 1">
        <div class="tarjeta-producto-body">
          <div>
            <h5>Smartphone</h5>
            <p class="text-muted">$299</p>
          </div>
          <button class="btn btn-primary mt-2">Comprar</button>
        </div>
      </div>

      <!-- Producto 2 -->
      <div class="tarjeta-producto">
        <img src="./assets/images/foto_2.jpg" alt="Producto 2">
        <div class="tarjeta-producto-body">
          <div>
            <h5>Chaqueta Deportiva</h5>
            <p class="text-muted">$79</p>
          </div>
          <button class="btn btn-primary mt-2">Comprar</button>
        </div>
      </div>

      <!-- Producto 3 -->
      <div class="tarjeta-producto">
        <img src="./assets/images/foto_3.jpg" alt="Producto 3">
        <div class="tarjeta-producto-body">
          <div>
            <h5>Set de Cocina</h5>
            <p class="text-muted">$59</p>
          </div>
          <button class="btn btn-primary mt-2">Comprar</button>
        </div>
      </div>

      <!-- Producto 4 -->
      <div class="tarjeta-producto">
        <img src="./assets/images/foto_4.jpg" alt="Producto 4">
        <div class="tarjeta-producto-body">
          <div>
            <h5>Bicicleta de Montaña</h5>
            <p class="text-muted">$450</p>
          </div>
          <button class="btn btn-primary mt-2">Comprar</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Pie de página -->
  <footer>
    &copy; 2025 desafio latam_ Mi Tienda Online. Alfonso Palacios - Todos los derechos reservados.
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
